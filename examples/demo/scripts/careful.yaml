"Combien de clients avons-nous en France ?":
  steps:
    - {tool: describe_table, input: {table: customers}}
    - {tool: run_sql, input: {sql: "SELECT COUNT(*) AS n FROM customers WHERE country = 'FR'"}}
  answer: "4 clients sont basés en France."
"Quel est le chiffre d'affaires 2025 ?":
  steps:
    - {tool: lookup_glossary, input: {term: "chiffre d'affaires"}}
    - {tool: run_sql, input: {sql: "SELECT SUM(l.qty * l.unit_price) FROM order_lines l JOIN orders o ON o.order_id = l.order_id WHERE o.status <> 'CNL' AND o.order_date >= '2025-01-01'"}}
  answer: "Le chiffre d'affaires 2025 est de 3 684 € (hors commandes annulées)."
"Combien de commandes ont été livrées ?":
  steps:
    - {tool: lookup_glossary, input: {term: "commande livrée"}}
    - {tool: run_sql, input: {sql: "SELECT COUNT(*) FROM orders WHERE status = 'DLV'"}}
  answer: "6 commandes ont été livrées."
"Quel transporteur a effectué le plus de livraisons ?":
  steps:
    - {tool: describe_table, input: {table: shipments}}
    - {tool: run_sql, input: {sql: "SELECT carrier, COUNT(*) AS livraisons FROM shipments WHERE delivered_at IS NOT NULL GROUP BY carrier ORDER BY 2 DESC LIMIT 1"}}
  answer: "DHL, avec 4 livraisons."
"Quel est le panier moyen de nos clients professionnels ?":
  steps:
    - {tool: lookup_glossary, input: {term: "panier moyen"}}
    - {tool: run_sql, input: {sql: "SELECT SUM(l.qty * l.unit_price) / COUNT(DISTINCT o.order_id) FROM orders o JOIN order_lines l ON l.order_id = o.order_id JOIN customers c ON c.customer_id = o.customer_id WHERE c.segment = 'B2B' AND o.status <> 'CNL'"}}
  answer: "Le panier moyen B2B est de 716 €."
"Quelle est la marge brute par produit ?":
  steps:
    - {tool: describe_table, input: {table: products}}
  answer: "Je ne peux pas calculer la marge : la base ne contient pas de coût d'achat."
"Quel produit s'est le plus vendu en quantité ?":
  steps:
    - {tool: run_sql, input: {sql: "SELECT p.label, SUM(l.qty) FROM order_lines l JOIN orders o ON o.order_id = l.order_id JOIN products p ON p.product_id = l.product_id WHERE o.status <> 'CNL' GROUP BY p.label ORDER BY 2 DESC LIMIT 1"}}
  answer: "Grains arabica 1kg, 77 unités."
